# AI model gateway access configuration.
# This file stores operational endpoint parameters only. Never write API keys here.

schema_version: "0.1"
last_updated: "2026-08-31"

# Development uses the internet MiniMax gateway on the current workstation.
# Terminal deployment uses the stable terminal_cnpe_intranet_qwen_fast profile
# identifier for compatibility; that profile now resolves to Qwen3.8.
active_profile: "development_minimax"

profiles:
  development_minimax:
    description: "Development/test environment through MiniMax OpenAI-compatible API"
    architecture: "internet_openai_compatible_gateway"
    provider: "minimax"
    protocol: "openai_compatible"
    network_mode: "internet_allowed"
    base_url: "https://api.minimaxi.com/v1"
    allowed_hosts: ["api.minimaxi.com"]
    # Applies when an MCP endpoint is supplied to the connectivity probe.
    mcp_allowed_hosts: ["127.0.0.1", "localhost"]
    models_path: "/models"
    chat_completions_path: "/chat/completions"
    responses_path: "/responses"
    api_key_env_var: "MiniMax-API"
    api_key_required: true
    authorization_scheme: "bearer"
    chat_model: "MiniMax-M3"
    structured_model: "MiniMax-M3"
    stream_enabled: true
    timeout_sec: 60
    connect_timeout_sec: 15
    model_list_required: true
    ssl_no_revoke: false
    test_prompt: "Reply exactly: AI_CONNECTIVITY_OK"
    expected_response_contains: "AI_CONNECTIVITY_OK"
    # Diagnostic discovery only. Unsupported optional capabilities do not fail
    # core connectivity.
    agent_probe_enabled: true
    multimodal_probe_enabled: true
    concurrency_probe_count: 2
    mcp_streamable_http_url: ""
    mcp_sse_url: ""
    mcp_stdio_command: ""
    mcp_api_key_env_var: ""
    # Optional deployment application probe. Leave the URL empty on a shared
    # developer machine; pass it explicitly when checking a packaged server.
    application_api_base_url: ""
    application_api_state_path: "/api/ai/state"
    application_api_host_header: ""
    application_api_forwarded_for_probe: "198.18.0.73"

  terminal_cnpe_intranet_qwen_fast:
    description: "Terminal deployment through CNPE intranet Qwen3.8 OpenAI-compatible model gateway"
    architecture: "intranet_openai_compatible_gateway"
    provider: "cnpe-qwen-medium"
    protocol: "openai_compatible"
    network_mode: "intranet_only"
    base_url: "http://models.ai.cnpe.cc/qwen_medium/v1"
    allowed_hosts: ["models.ai.cnpe.cc"]
    # Keep this explicit and limited to approved internal MCP hosts.
    mcp_allowed_hosts: ["127.0.0.1", "localhost", "models.ai.cnpe.cc"]
    models_path: "/models"
    chat_completions_path: "/chat/completions"
    responses_path: "/responses"
    api_key_env_var: ""
    api_key_required: false
    authorization_scheme: "none"
    chat_model: "Qwen3.8-27B"
    structured_model: "Qwen3.8-27B"
    stream_enabled: true
    timeout_sec: 60
    connect_timeout_sec: 15
    model_list_required: false
    ssl_no_revoke: false
    test_prompt: "Please reply exactly: AI_CONNECTIVITY_OK"
    expected_response_contains: "AI_CONNECTIVITY_OK"
    # Keep these probes enabled until the terminal capability matrix has been
    # captured. They are non-destructive and optional for overall status.
    agent_probe_enabled: true
    multimodal_probe_enabled: true
    concurrency_probe_count: 2
    mcp_streamable_http_url: ""
    mcp_sse_url: ""
    mcp_stdio_command: ""
    mcp_api_key_env_var: ""
    # Terminal default: exercise the local IIS/ARR /api proxy, not just the model gateway.
    # Override with -ApplicationApiBaseUrl when the terminal uses port 80 or another site binding.
    application_api_base_url: "http://127.0.0.1:8080"
    application_api_state_path: "/api/ai/state"
    application_api_host_header: ""
    application_api_forwarded_for_probe: "198.18.0.73"
