# ============================================================================
# CNPE 图纸处理系统 - AI 层参数规范 v0.1
# ============================================================================
# 说明：
# - 本文件用于描述 AI 辅助层的模型、知识库、图纸元素理解、问答和安全边界参数。
# - 与 documents/参数规范.yaml、documents/参数规范_运行期.yaml 分离，避免 AI 配置与
#   既有业务字段、CAD/Office 运行参数耦合。
# - 实机环境默认处于内部局域网；外部互联网能力默认禁用。
# - 大模型服务必须通过内部 OpenAI-compatible API 网关访问，不在前端直连模型。
# ============================================================================

schema_version: "0.1"
last_updated: "2026-07-10"

ai_layer:
  enabled:
    type: bool
    default: true
    desc: "AI 辅助层总开关；关闭后所有 AI 对话和理解能力都不可用"

  deployment_profile:
    network_mode:
      type: enum
      default: "intranet_only"
      options: ["intranet_only", "restricted_proxy", "internet_allowed"]
      desc: "部署网络模式；实机默认内部局域网"
    allow_external_network:
      type: bool
      default: false
      desc: "是否允许 AI 层访问外部互联网；实机默认禁止"
    frontend_direct_model_access:
      type: bool
      default: false
      desc: "前端是否允许直连模型；必须保持 false，由后端统一代理"

  bootstrap_contract:
    ai_spec_path_env_var:
      type: str
      default: "FANBAN_AI_SPEC_PATH"
      desc: "AI 参数规范文件路径的启动期环境变量"
    api_key_env_var:
      type: str
      default: "FANBAN_AI_API_KEY"
      desc: "模型网关 API key 环境变量；不得写入 YAML 明文"
    base_url_env_var:
      type: str
      default: "FANBAN_AI_BASE_URL"
      desc: "内部 OpenAI-compatible 网关地址环境变量；优先级高于 YAML 默认值"

  model_gateway:
    provider:
      type: enum
      default: "openai_compatible"
      options: ["openai_compatible"]
      desc: "模型网关协议；当前只接受 OpenAI-compatible API"
    base_url:
      type: str
      default: "http://127.0.0.1:8001/v1"
      desc: "无 profile 时的本机模型网关回退地址；部署时可用 FANBAN_AI_BASE_URL 覆盖"
    api_key_policy:
      type: enum
      default: "env_only"
      options: ["env_only"]
      desc: "API key 只允许从环境变量读取"
    timeout_sec:
      type: int
      default: 60
      desc: "单次模型请求超时"
    max_retries:
      type: int
      default: 1
      desc: "模型请求失败后的重试次数"
    retry_backoff_ms:
      type: int
      default: 800
      desc: "模型请求重试退避间隔"

  models:
    chat:
      model:
        type: str
        default: "MiniMax-M3"
        desc: "默认 MiniMax 对话模型名称"
      temperature:
        type: float
        default: 0.1
        desc: "默认低温度，优先稳定、可复核输出"
      max_output_tokens:
        type: int
        default: 2048
        desc: "默认回答最大输出 token"
    structured:
      model:
        type: str
        default: "MiniMax-M3"
        desc: "结构化 JSON 输出使用的 MiniMax 模型"
      require_json_schema:
        type: bool
        default: true
        desc: "要求后端用 JSON Schema 校验模型输出；模型不支持强约束时由后端重试/降级"
    embedding:
      model:
        type: str
        default: "internal-embedding"
        desc: "内部向量模型名称"
      dimensions:
        type: int
        default: 1024
        desc: "向量维度；需与实际内部模型一致"
      batch_size:
        type: int
        default: 64
        desc: "知识库入库时的 embedding 批大小"

  drawing_understanding:
    element_package:
      enabled:
        type: bool
        default: true
        desc: "是否启用图纸元素包生成"
      input_extensions:
        type: "list[str]"
        default: [".dwg", ".dxf"]
        desc: "图纸元素包支持的输入扩展名"
      output_root:
        type: str
        default: "outputs/drawing-understanding"
        desc: "元素包默认输出目录；属于生成产物，不建议提交 git"
      dxf_cache_dir_name:
        type: str
        default: "dxf"
        desc: "元素包输出目录中的 DXF 缓存子目录"
      max_geometry_elements_per_drawing:
        type: int
        default: 200000
        desc: "单张图写入元素包的几何元素上限；超限必须标记 truncated"
      include_text_elements:
        type: bool
        default: true
        desc: "是否写入普通文本、块内文本、属性文本等文本元素"
      include_geometry_elements:
        type: bool
        default: true
        desc: "是否写入 LINE/LWPOLYLINE/POLYLINE/CIRCLE/ARC/INSERT/DIMENSION 等几何元素"
      include_titleblock_frames:
        type: bool
        default: true
        desc: "是否写入现有图框检测和图签提取结果"
      infer_identity_from_titleblock:
        type: bool
        default: true
        desc: "文件名无法推断项目号/机组号时，是否从图签内部编码多数前缀回填"

    semantic_tags:
      enabled:
        type: bool
        default: true
        desc: "是否启用第一版规则语义标签"
      tag_set:
        type: "list[str]"
        default:
          - "internal_code"
          - "external_code"
          - "project_no"
          - "unit_no"
          - "drawing_title_candidate"
          - "wall_mark"
          - "scale"
          - "page_marker"
          - "grid_or_revision_marker"
        desc: "第一版语义标签集合"
      internal_code_pattern:
        type: str
        default: "\\b(?P<project_no>\\d{4})(?P<unit_no>[1-9])?[A-Z]{2,4}-[A-Z]{2,5}\\d{2}-\\d{3}\\b"
        desc: "内部编码识别正则；后续应迁入代码读取"
      external_code_pattern:
        type: str
        default: "\\b[A-Z0-9]{19}\\b"
        desc: "19 位外部编码识别正则"
      known_project_nos:
        type: "list[str]"
        default: ["1818", "1907", "1915", "1916", "2016", "2026", "2035", "1418"]
        desc: "AI 层辅助识别项目号时使用的已知项目号；应与业务参数保持一致"
      title_keywords:
        type: "list[str]"
        default: ["图", "平面", "剖面", "模板", "配筋", "布置", "详图", "索引", "节点"]
        desc: "图纸标题候选关键词"
      wall_keywords:
        type: "list[str]"
        default: ["墙", "WALL"]
        desc: "墙编号候选关键词"

  template_understanding:
    enabled:
      type: bool
      default: true
      desc: "是否启用模板文件解析和规则提炼；用于 AI 层理解现有交付模板结构"
    output_root:
      type: str
      default: "outputs/template-understanding"
      desc: "模板解析结果默认输出目录；属于生成产物，不建议提交 git"
    office:
      parse_docx_embedded_xlsx:
        type: bool
        default: true
        desc: "封面 docx 模板采用嵌入 Excel OLE，解析时必须读取 word/embeddings/*.xlsx"
      parse_excel_headers:
        type: bool
        default: true
        desc: "解析目录、设计文件、IED 等 xlsx 模板时提取 sheet、表头、合并单元格和非空单元格"
      max_preview_cells:
        type: int
        default: 220
        desc: "模板结构预览写入 JSON 的单表最大非空单元格数量"
    factory_index_maps:
      enabled:
        type: bool
        default: true
        desc: "是否解析厂房索引图 DWG 模板"
      source_root:
        type: str
        default: "documents_bin/factory_index_maps"
        desc: "厂房索引图模板目录"
      required_anchor_types:
        type: "list[str]"
        default: ["angle_text", "compass"]
        desc: "厂房索引图替换候选需要同时具备的锚点类型"
      variant_discriminators:
        type: object
        default:
          "2016":
            "1":
              required_texts: ["QF"]
            "2":
              forbidden_texts: ["QF"]
          "1916":
            "3":
              required_texts: ["KP"]
            "4":
              forbidden_texts: ["KP"]
        desc: "岛号/机组号模板区分文字规则；来自运行期 factory_index_maps.source_variant_rules"

  knowledge_base:
    enabled:
      type: bool
      default: false
      desc: "是否启用本地知识库/RAG"
    source_roots:
      type: "list[str]"
      default:
        - "documents"
        - "documents_bin"
        - "storage/jobs"
        - "storage/groups"
      desc: "知识库默认索引来源；storage 来源需要按权限与脱敏策略过滤"
    vector_store:
      backend:
        type: enum
        default: "local_jsonl"
        options: ["local_jsonl", "qdrant", "chroma", "faiss"]
        desc: "向量存储后端；第一版可用 local_jsonl，部署后再切 qdrant/chroma/faiss"
      path:
        type: str
        default: "storage/ai/vector-store"
        desc: "本地向量库存储路径"
      collection_name:
        type: str
        default: "fanban_documents"
        desc: "向量集合名称"
    chunking:
      max_chars:
        type: int
        default: 1800
        desc: "知识片段最大字符数"
      overlap_chars:
        type: int
        default: 200
        desc: "知识片段重叠字符数"
      preserve_headings:
        type: bool
        default: true
        desc: "切片时是否保留标题路径"

  chat:
    enabled:
      type: bool
      default: true
      desc: "是否启用网页 AI 对话助手；模型调用必须从后端发出"
    default_agent:
      type: str
      default: "general_assistant"
      desc: "默认智能体 ID"
    max_history_messages:
      type: int
      default: 20
      desc: "每次模型调用最多携带的历史 user/assistant 消息数"
    max_user_message_chars:
      type: int
      default: 4000
      desc: "单条用户消息最大字符数"
    request_timeout_seconds:
      type: int
      default: 60
      desc: "后端等待模型返回的超时时间"
    retention_days:
      type: int
      default: 30
      desc: "AI 对话记录默认保留天数；后续清理任务按该值执行"
    response_format:
      enabled:
        type: bool
        default: true
        desc: "是否要求模型按前端支持的安全 Markdown 格式输出"
      system_prompt_suffix:
        type: str
        default: |-
          使用 GitHub Flavored Markdown 组织回答。
          普通说明使用段落、列表和表格；命令、程序和配置使用围栏代码块。
          ANSYS Mechanical APDL、MAPDL 或 APDL 命令流必须使用 ```apdl 语言标签。
          不要输出原始 HTML。
        desc: "附加到所有 Agent 系统提示词末尾的统一响应格式规则"
    concurrency:
      max_global_requests:
        type: int
        default: 4
        desc: "后端部署机同时发起的 AI 模型请求上限"
      max_per_owner_requests:
        type: int
        default: 1
        desc: "同一用户标识同一时间允许的 AI 请求数；第一版按 IP 区分"
    agents:
      - agent_id: "general_assistant"
        name: "通用对话"
        description: "进行正常知识问答、写作和日常交流"
        system_prompt: "你是通用 AI 助手，可以进行正常、完整的知识问答和日常交流。用户明确要求读取后端允许目录时，可以使用已注册的只读工具。"
      - agent_id: "business_agent"
        name: "业务 Agent"
        description: "统一处理图纸理解、任务、模板规则和出图平台业务问题"
        system_prompt: "你是出图平台业务 Agent，统一处理图纸理解、任务状态、模板规则、部署链路和平台使用问题。需要平台或文件事实时优先使用已注册的只读工具核实。"
    skills:
      - skill_id: "ansys_mapdl_18_2"
        name: "ANSYS MAPDL 18.2"
        description: "自动检索本地 ANSYS Mechanical APDL 18.2 授权语料，解释命令、单元、材料、KEYOPT 和求解流程"
        enabled: true
        read_only: true
        handler: "ansys_mapdl_18_2"
        root: "storage/ai/skills/ansys-mapdl-18-2"
        root_env_var: "FANBAN_ANSYS_MAPDL_SKILL_ROOT"
        auto_trigger: true
        trigger_terms:
          - "ANSYS"
          - "MAPDL"
          - "APDL"
          - "Mechanical APDL"
          - "KEYOPT"
          - "ANTYPE"
          - "/PREP7"
          - "/SOLU"
          - "/POST1"
          - "/POST26"
          - "*GET"
          - "*DIM"
          - "*DO"
          - "TBDATA"
        max_results: 4
        max_context_chars: 16000
        query_timeout_seconds: 20
        history_followup_messages: 6
    mcp_servers: []
    read_only_host_access:
      enabled:
        type: bool
        default: true
        desc: "是否向所有对话模式提供受控的后端只读文件工具"
      allowed_roots:
        type: "list[str]"
        default:
          - "storage"
          - "documents"
          - "documents_bin"
          - "backend-runtime/backend/src/cad"
          - "backend/src/cad"
        desc: "相对于部署根目录的只读目录白名单；不存在的目录会被忽略"
      denied_names:
        type: "list[str]"
        default: [".env", "ai_model_gateway.yaml", "runtime.env.ps1"]
        desc: "禁止读取的敏感文件名，不区分大小写"
      denied_suffixes:
        type: "list[str]"
        default: [".db", ".dll", ".exe", ".key", ".p12", ".pem", ".pfx", ".sqlite", ".sqlite3"]
        desc: "禁止读取的文件后缀，不区分大小写"
      max_read_bytes:
        type: int
        default: 262144
        desc: "单次只读文件工具允许读取的最大字节数"
      max_search_results:
        type: int
        default: 50
        desc: "单次文件搜索返回结果上限"
      max_depth:
        type: int
        default: 6
        desc: "目录搜索允许递归的最大层级"
      max_tool_rounds:
        type: int
        default: 3
        desc: "单条消息允许的模型只读工具调用轮数上限"

  qa_assistant:
    enabled:
      type: bool
      default: false
      desc: "是否启用图纸问答助手"
    mode:
      type: enum
      default: "rule_based_seed"
      options: ["rule_based_seed", "rag_llm"]
      desc: "问答模式；第一版规则种子，后续接入 RAG + 内网模型"
    max_evidence_items:
      type: int
      default: 20
      desc: "单次回答返回的证据条数上限"
    max_context_chars:
      type: int
      default: 12000
      desc: "传入模型的元素包上下文最大字符数"
    unsupported_question_policy:
      type: enum
      default: "explicit_refusal"
      options: ["explicit_refusal", "fallback_to_rag"]
      desc: "规则问答不支持的问题如何处理"

  safety:
    model_output_must_be_grounded:
      type: bool
      default: true
      desc: "模型回答必须引用元素包、知识库或任务记录证据"
    allow_model_to_modify_dwg:
      type: bool
      default: false
      desc: "是否允许模型直接修改 DWG；必须保持 false"
    allow_model_to_modify_yaml:
      type: bool
      default: false
      desc: "是否允许模型直接改 YAML；必须保持 false，改动应走人工确认和代码审查"
    allow_model_to_submit_workflow:
      type: bool
      default: false
      desc: "是否允许模型提交/审批/归档流程；必须保持 false"
    sensitive_paths:
      type: "list[str]"
      default:
        - "documents_bin/姓名角色表.csv"
        - "storage"
      desc: "AI 层读取时需要权限控制或脱敏的路径"
    prompt_injection_guard:
      enabled:
        type: bool
        default: true
        desc: "是否启用提示注入防护"
      untrusted_content_fields:
        type: "list[str]"
        default: ["raw_text", "text", "title_cn", "title_en"]
        desc: "来自图纸/文档的非可信文本字段"

  audit_and_cache:
    request_log_enabled:
      type: bool
      default: true
      desc: "是否记录 AI 请求审计日志"
    request_log_dir:
      type: str
      default: "storage/ai/logs"
      desc: "AI 请求审计日志目录"
    cache_enabled:
      type: bool
      default: true
      desc: "是否启用 AI 响应缓存"
    cache_dir:
      type: str
      default: "storage/ai/cache"
      desc: "AI 响应缓存目录"
    redact_api_key_in_logs:
      type: bool
      default: true
      desc: "日志中必须隐藏 API key"
