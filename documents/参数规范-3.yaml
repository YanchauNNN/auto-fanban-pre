      probe:
        timeout_sec: 30
        max_output_bytes: 1048576
        fixture_source_relative_path: "fixtures/archive-runtime-smoke-rar5.rar.b64"
        fixture_encoding: "base64"
        fixture_source_sha256: "324185d843a8046ad64fbaa434c80c2568e49662c3f16c5c7e24ce7eacc2bc92"
        fixture_source_size_bytes: 173
        fixture_decoded_sha256: "b0c3ccb16412f5215da3ae12f8bafd6fa4524ff44831283a7963b3afc792a886"
        fixture_decoded_size_bytes: 129
        payload_source_relative_path: "fixtures/archive-runtime-smoke.txt"
        payload_filename: "archive-runtime-smoke.txt"
        payload_sha256: "6eaab97fc311dcba726775b8aa04165069688caa965df2fde9e12813cb74802f"
        payload_size_bytes: 40
    installers:
      dotnet48:
        filename: "ndp48-x86-x64-allos-enu.exe"
        url: "https://go.microsoft.com/fwlink/?linkid=2088631"
      vc_redist_x64:
        filename: "VC_redist.x64.exe"
        url: "https://aka.ms/vs/17/release/vc_redist.x64.exe"
      python_313_x64:
        filename: "python-3.13.12-embed-amd64.zip"
        url: "https://www.python.org/ftp/python/3.13.12/python-3.13.12-embed-amd64.zip"
      url_rewrite_x64:
        filename: "rewrite_amd64_zh-CN.msi"
        url: "https://download.microsoft.com/download/1/2/8/128E2E22-C1B9-44A4-BE2A-5859ED1D4592/rewrite_amd64_zh-CN.msi"
      arr_x64:
        filename: "requestRouter_amd64.msi"
        url: "https://go.microsoft.com/fwlink/?LinkID=615136"
