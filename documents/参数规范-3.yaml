# ============================================================================
# CNPE 图纸处理系统 - 后端机制参数规范 v1.0
# ============================================================================
# 说明：
# - 本文件只承接后端机制/策略参数，不重复声明业务规范或运行期规范已有根域。
# - 业务事实源仍见 documents/参数规范.yaml。
# - 并发、路径、外部程序等运行期参数仍见 documents/参数规范_运行期.yaml。
# ============================================================================

schema_version: "1.0"
last_updated: "2026-08-08"

backend_mechanism:
  permissions:
    account_admin_roles: ["管理员"]
    workflow_admin_roles: ["管理员"]
    workload_scope_roles:
      office: ["室主任", "所领导", "管理员"]
      institute: ["所领导", "管理员"]
      admin: ["管理员"]

  archive_defaults:
    engineering_no: "UNKNOWN_ENGINEERING"
    subitem_no: "UNKNOWN_SUBITEM"
    album_internal_code: "UNKNOWN_ALBUM"
    revision: "A"

  workload_settlement:
    include_initiator: true
    initiator_role_key: "initiator"
    include_approved_nodes: true
    node_role_key_source: "node_key"

  workflow_runtime:
    approval_terminal_status: "three_review_approved"
    archive_trigger_status: "three_review_approved"
    active_conflict_statuses:
      - "submitted"
      - "in_review"
      - "three_review_approved"
      - "archiving"
      - "archive_failed"

  task_group_submission:
    # 普通任务详情显式提交后才建立管理关联；未定义计量口径的计算书不纳入。
    standalone_job_types: ["deliverable"]
    shared_prep:
      invalid_error: "shared_prep_invalid"
      source_missing_error: "shared_prep_source_missing"
      source_outside_error: "shared_prep_source_outside"
    required_task_roles:
      - task_role: "deliverable_main"
        missing_role_error: "deliverable_main_missing"
        duplicate_role_error: "deliverable_main_duplicate"
        artifacts:
          - field: "package_zip"
            not_declared_error: "deliverable_package_not_declared"
            not_found_error: "deliverable_package_not_found"
          - field: "ied_xlsx"
            not_declared_error: "deliverable_ied_not_declared"
            not_found_error: "deliverable_ied_not_found"
            required_when:
              source: "params"
              field: "include_ied_plan"
              equals: true
              default: true

  workload_runtime:
    status_options:
      - { label: "全部状态", value: "" }
      - { label: "已结算", value: "settled" }
      - { label: "待结算", value: "pending" }
      - { label: "无效", value: "invalid" }

  management_ui:
    workload_scope_labels:
      me: "个人"
      office: "科室"
      institute: "全所"
      admin: "管理员"
    workflow_status_labels:
      draft: "草稿"
      submitted: "已提交"
      in_review: "审批中"
      three_review_approved: "三审通过"
      archiving: "归档中"
      archived: "已归档"
      archive_failed: "归档失败"
      cancelled: "已取消"
    archive_status_labels:
      pending: "待归档"
      running: "归档中"
      succeeded: "已归档"
      failed: "归档失败"
    empty_current_node_label: "未进入审批"

  audit_display:
    forbidden_terms: ["工种"]
    forbidden_term_connected_han_whitelist: ["工种"]
    forbidden_term_priority:
      工种: 0
    finding_group_priority:
      工种: 0
    directly_filtered_flag_codes:
      - "PLOT_FROM_SOURCE_WINDOW"
      - "PLOT_WINDOW_USED"

  audit_replace:
    unit_factory_codes:
      - "RC"
      - "RB"
      - "RX"
      - "NH"
      - "NX"
    unit_factory_code_alias_groups:
      - ["RC", "RX"]
      - ["NH", "NX"]
    batch_filename_identity_regex: '(\d{4})([0-9])([A-Z0-9]{2,4})-?[A-Z]{3}\d{2}'

  calculation_book:
    ocr_threshold: 160
    ocr_legend_value_count: 10
    ocr_min_confidence: 50.0
    ocr_min_vertical_ratio: 0.35
    ocr_endpoint_absolute_tolerance: 1.0
    ocr_endpoint_relative_tolerance: 0.002
    ocr_header_crop: [0.025, 0.02, 0.20, 0.24]
    ocr_legend_crop: [0.06, 0.84, 0.88, 1.0]
    ocr_header_scale: 4
    ocr_legend_scale: 3
    chapter: "7.1"
    ai_normalization:
      schema_correction_max_attempts: 2
    ai_suggestion:
      margin_ratio: 0.10
      xy:
        diameters: [16, 18, 20, 25, 28, 32, 36, 40]
        hard_priority: ["1@200", "1@150", "2@200", "2@150"]
      z:
        diameters: [6, 8, 10, 12, 14, 16]
        hard_priority:
          - "1@400x400"
          - "1@200x400"
          - "1@200x200"
          - "2@400x400"
          - "2@200x400"
          - "2@200x200"
      zero_or_missing_smx:
        fixed_spec: "1C14@400x400"
      slab_direction_mapping:
        top_x: "X"
        middle_x: "X"
        bottom_x: "X"
        top_y: "Y"
        middle_y: "Y"
        bottom_y: "Y"
        z: "Z"
      word_declaration: "以下配筋建议由人工智能根据结果云图 SMX 值并保留不低于 10% 的面积裕度生成，供设计人员复核。"

  project_inference:
    project_no_prefix_regex: '(?P<project_no>\d{4})(?=[0-9][A-Z0-9]{2,4}-?[A-Z]{3}\d{2})|^(\d{4})(?=[-_A-Z0-9]|$)'
    unit_no_by_project_prefix_regex: '(?P<project_no>\d{4})(?P<unit_no>[0-9])(?=[A-Z0-9]{2,4}-?[A-Z]{3}\d{2})'
    default_project_no: "2016"

  api_runtime:
    job_completion_wait_timeout_sec: 3600
    job_summary_sync_interval_sec: 3
    worker_heartbeat_interval_sec: 10
    worker_claim_timeout_sec: 90
    jobs_activity_stream_poll_interval_sec: 2
    jobs_activity_stream_keepalive_sec: 15
    jobs_activity_stream_max_duration_sec: 60
    jobs_activity_stream_retry_ms: 5000
    stage_labels:
      INIT: "初始化"
      PREP_SOURCE: "准备源文件"
      INGEST: "接收文件"
      FONT_PREFLIGHT_AND_REPLACE: "字体预检与替换"
      CONVERT_DWG_TO_DXF: "转换 DWG/DXF"
      DETECT_FRAMES: "识别图框"
      VERIFY_FRAMES_BY_ANCHOR: "锚点校验图框"
      SCALE_FIT_AND_CHECK: "图幅比例校验"
      EXTRACT_TITLEBLOCK_FIELDS: "提取图签字段"
      A4_MULTIPAGE_GROUPING: "A4 多页合并"
      FIX_TITLEBLOCK_CONSISTENCY: "修正图签一致性"
      SPLIT_AND_RENAME: "拆分与命名"
      EXPORT_PDF_AND_DWG: "导出 DWG/PDF"
      GENERATE_DOCS: "生成目录和文档"
      PACKAGE_ZIP: "生成交付压缩包"
      DELIVERABLE_BRANCH: "执行出图子任务"
      AUDIT_BRANCH: "执行纠错子任务"
      DOCS_AND_PACKAGE: "整理文档与压缩包"
      GROUP_COMPLETE: "任务包完成"
      AUDIT_CHECK: "执行纠错识别"
      AUDIT_REPLACE: "执行翻版替换"
      EXPORT_REPORT: "导出纠错报告"
      VALIDATE_ARCHIVE: "校验计算图片 ZIP/RAR"
      OCR_REINFORCEMENT: "识别底部应力图例"
      SELECT_REBAR: "匹配并核验实配钢筋"
      RENDER_CALCULATION_BOOK: "渲染 Word 计算书"
      FINALIZE_ARTIFACT: "整理计算书产物"

  cad_runtime_mechanism:
    min_supported_autocad_year: 2010
    pdf2_pc3_name: "打印PDF2.pc3"
    default_install_year_start: 2026
    default_install_year_end: 2010
    default_install_roots:
      - "D:\\AUTOCAD"
      - "C:\\AUTOCAD"
      - "D:\\Program Files\\AUTOCAD"
      - "C:\\Program Files\\AUTOCAD"
      - "D:\\Program Files\\Autodesk"
      - "C:\\Program Files\\Autodesk"
    default_pdf_media_name: "ISO_A1_(841.00_x_594.00_MM)"
    pdf_media_map:
      - { size: [1189, 841], name: "ISO_A0_(1189.00_x_841.00_MM)" }
      - { size: [841, 1189], name: "ISO_A0_(841.00_x_1189.00_MM)" }
      - { size: [841, 594], name: "ISO_A1_(841.00_x_594.00_MM)" }
      - { size: [594, 841], name: "ISO_A1_(594.00_x_841.00_MM)" }
      - { size: [594, 420], name: "ISO_A2_(594.00_x_420.00_MM)" }
      - { size: [420, 594], name: "ISO_A2_(420.00_x_594.00_MM)" }
      - { size: [420, 297], name: "ISO_A3_(420.00_x_297.00_MM)" }
      - { size: [297, 420], name: "ISO_A3_(297.00_x_420.00_MM)" }
      - { size: [297, 210], name: "ISO_A4_(297.00_x_210.00_MM)" }
      - { size: [210, 297], name: "ISO_A4_(210.00_x_297.00_MM)" }
    office_com_retry_policy:
      excel_active_object: { retries: 36, delay_sec: 0.5 }
      excel_dispatch: { retries: 3, delay_sec: 0.8 }
      excel_call: { retries: 10, delay_sec: 0.5 }
      excel_ready: { retries: 18, delay_sec: 0.5 }
      word_call: { retries: 6, delay_sec: 0.8 }
      word_dispatch: { retries: 3, delay_sec: 0.8 }

  deployment_mechanism:
    spec_name: "参数规范.yaml"
    runtime_spec_name: "参数规范_运行期.yaml"
    mechanism_spec_name: "参数规范-3.yaml"
    default_frontend_api_port: 8000
    managed_pdf2_pc3_name: "打印PDF2.pc3"
    managed_monochrome_ctb_name: "fanban_monochrome.ctb"
    business_probes:
      schema_version: "fanban-business-probe@1"
      results_relative_dir: "probe-results"
      request_timeout_sec: 15
      office_worker_timeout_sec: 90
      task_timeout_sec: 3600
      log_retention_days: 14
      max_event_context_bytes: 131072
      required_health_fields: ["ready", "storage_writable", "worker_alive", "worker_count"]
      sensitive_key_patterns: ["password", "authorization", "token", "api_key", "apikey", "secret", "cookie"]
    archive_runtime:
      version: "26.02"
      architecture: "x64"
      source:
        filename: "7z2602-x64.exe"
        url: "https://github.com/ip7z/7zip/releases/download/26.02/7z2602-x64.exe"
        sha256: "6745fa76dc2ea031596d8678f6f6b99c3c1b435b4164a63485adbbc7b8d82ef0"
        size_bytes: 1657896
      bootstrap:
        filename: "7zr.exe"
        url: "https://github.com/ip7z/7zip/releases/download/26.02/7zr.exe"
        sha256: "56b8cc9f4971cef253644fafe54063ed7fdca551d4dee0f8c6baa81b855acd72"
        size_bytes: 602112
      license_url: "https://www.7-zip.org/license.txt"
      cache_dir: "build/runtime-cache/7-Zip"
      destination_dir: "bin/7-Zip"
      provenance_filename: "PROVENANCE.txt"
      required_files:
        - filename: "7z.exe"
          sha256: "83967f1b02b43c4efeda302795722c809e0e81b8307de73558d10484d5676a7d"
        - filename: "7z.dll"
          sha256: "69fd4df057985c40e510e2fac182881c7f85e90aa13ec703f763a8fdb2ce61f8"
        - filename: "License.txt"
          sha256: "519ac0a4bded9c18ea02e0afb71f663d8c47373bd9facd3ac96a79f51d77765d"
      required_handlers: ["7z", "zip", "Rar", "Rar5"]
      version_marker: "7-Zip 26.02 (x64)"
      download_timeout_sec: 120
